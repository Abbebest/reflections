<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مُقتبَس — اقتباسات من الأدباء والفلاسفة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:  #ece8de;
    --card:   #fbf9f3;
    --ink:    #2b2621;
    --lapis:  #275c86;
    --ochre:  #b08842;
    --muted:  #8a8073;
    --line:   #e0d9cb;

    --c-hikma:   #275c86;
    --c-falsafa: #6a4a73;
    --c-adab:    #b08842;
    --c-hob:     #a85d57;
    --c-hayat:   #5e7a5a;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    font-family:"Tajawal", system-ui, sans-serif;
    color:var(--ink);
    background:var(--paper);
    line-height:1.6;
    min-height:100vh;
    padding:clamp(1.25rem, 4vw, 3rem);
  }

  .wrap{ max-width:1100px; margin:0 auto; }

  header{ text-align:center; margin-bottom:clamp(1.5rem,4vw,2.5rem); }

  .brand{
    font-family:"Amiri", serif;
    font-size:clamp(2.6rem, 8vw, 4rem);
    font-weight:700;
    color:var(--ink);
    line-height:1.1;
  }
  .brand::after{
    content:"";
    display:block;
    width:56px; height:3px;
    background:var(--ochre);
    margin:.9rem auto 0;
    border-radius:2px;
  }
  .tagline{
    color:var(--muted);
    font-size:clamp(.95rem,2.5vw,1.1rem);
    margin-top:.9rem;
  }

  .search{
    position:relative;
    max-width:520px;
    margin:clamp(1.5rem,4vw,2.25rem) auto 1.25rem;
  }
  .search input{
    width:100%;
    font-family:"Tajawal", sans-serif;
    font-size:1.05rem;
    color:var(--ink);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:.9rem 3rem .9rem 1.1rem;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .search input::placeholder{ color:#b3aa9c; }
  .search input:focus{
    outline:none;
    border-color:var(--lapis);
    box-shadow:0 0 0 3px rgba(39,92,134,.15);
  }
  .search .icon{
    position:absolute;
    inset-inline-end:1.1rem;
    top:50%; transform:translateY(-50%);
    color:var(--muted);
    pointer-events:none;
  }

  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:.55rem;
    justify-content:center;
    margin-bottom:1.75rem;
  }
  .chip{
    font-family:"Tajawal", sans-serif;
    font-size:.92rem;
    font-weight:500;
    color:var(--ink);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:.45rem 1.15rem;
    cursor:pointer;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .chip:hover{ border-color:var(--lapis); }
  .chip.active{
    background:var(--lapis);
    color:#fff;
    border-color:var(--lapis);
  }
  .chip:focus-visible{ outline:2px solid var(--lapis); outline-offset:2px; }

  .count{
    text-align:center;
    color:var(--muted);
    font-size:.9rem;
    margin-bottom:1.5rem;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:1.15rem;
  }

  .qcard{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:1.6rem 1.5rem 1.35rem;
    border-inline-start:4px solid var(--cat, var(--lapis));
    display:flex;
    flex-direction:column;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .qcard:hover{
    transform:translateY(-3px);
    box-shadow:0 14px 30px rgba(43,38,33,.10);
  }

  .qmark{
    font-family:"Amiri", serif;
    font-size:3rem;
    line-height:.2;
    color:var(--ochre);
    opacity:.4;
    height:1.1rem;
    user-select:none;
  }

  .qtext{
    font-family:"Amiri", serif;
    font-size:1.4rem;
    line-height:1.7;
    color:var(--ink);
    margin:.4rem 0 1.15rem;
    flex-grow:1;
  }

  .qfoot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:.75rem;
    border-top:1px solid var(--line);
    padding-top:.85rem;
  }
  .author{ font-weight:700; font-size:.98rem; color:var(--ink); }
  .cat{
    display:inline-flex;
    align-items:center;
    gap:.4rem;
    font-size:.8rem;
    color:var(--muted);
    white-space:nowrap;
  }
  .cat .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--cat, var(--lapis));
  }

  .empty{
    text-align:center;
    color:var(--muted);
    padding:3rem 1rem;
    font-size:1.1rem;
    grid-column:1 / -1;
  }

  footer{
    text-align:center;
    color:var(--muted);
    font-size:.85rem;
    margin-top:3rem;
  }

  @media (prefers-reduced-motion: reduce){
    .qcard{ transition:none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 class="brand">مُقتبَس</h1>
      <p class="tagline">مختاراتٌ من حكمة الأدباء والفلاسفة عبر العصور</p>
    </header>

    <div class="search">
      <input id="search" type="text" placeholder="ابحث عن كلمة أو اسم كاتب…" aria-label="بحث">
      <span class="icon" aria-hidden="true">🔍</span>
    </div>

    <nav class="filters" id="filters" aria-label="التصنيفات"></nav>

    <p class="count" id="count"></p>

    <main class="grid" id="grid"></main>

    <footer>مجموعة مختارة · تُحدَّث بين الحين والآخر</footer>
  </div>

<script>
  // ——— الاقتباسات (أضف ما تشاء هنا) ———
  const quotes = [
    { text:"على قدرِ أهلِ العزمِ تأتي العزائمُ، وتأتي على قدرِ الكرامِ المكارمُ.", author:"المتنبي", cat:"حكمة" },
    { text:"الخيلُ والليلُ والبيداءُ تعرفني، والسيفُ والرمحُ والقرطاسُ والقلمُ.", author:"المتنبي", cat:"أدب" },
    { text:"ذو العقلِ يشقى في النعيمِ بعقلِه، وأخو الجهالةِ في الشقاوةِ ينعمُ.", author:"المتنبي", cat:"حياة" },
    { text:"وإذا كانت النفوسُ كباراً، تعبتْ في مرادِها الأجسامُ.", author:"المتنبي", cat:"حكمة" },
    { text:"بقدرِ الكدِّ تُكتسبُ المعالي، ومن طلب العلا سهر الليالي.", author:"الإمام الشافعي", cat:"حكمة" },
    { text:"قيمةُ كلِّ امرئٍ ما يُحسنُه.", author:"علي بن أبي طالب", cat:"حكمة" },
    { text:"الناسُ نيامٌ، فإذا ماتوا انتبهوا.", author:"علي بن أبي طالب", cat:"حياة" },
    { text:"الحقيقةُ تحتاجُ إلى رجلين: واحدٍ لينطقَ بها، وآخرَ ليفهمَها.", author:"جبران خليل جبران", cat:"أدب" },
    { text:"الحبُّ الذي لا يتجدّدُ كلَّ يومٍ، يصيرُ عادةً ثم يصيرُ عبوديةً.", author:"جبران خليل جبران", cat:"حب" },
    { text:"الحياةُ التي لا يُتأمَّلُ فيها لا تستحقُّ أن تُعاشَ.", author:"سقراط", cat:"فلسفة" },
    { text:"الصديقُ روحٌ واحدةٌ تسكنُ جسدين.", author:"أرسطو", cat:"فلسفة" },
    { text:"الحاجةُ أمُّ الاختراعِ.", author:"أفلاطون", cat:"فلسفة" },
    { text:"مَن له سببٌ يعيشُ من أجله، يحتملُ أيَّ طريقةٍ للعيشِ تقريباً.", author:"نيتشه", cat:"فلسفة" },
    { text:"أنا أفكّرُ، إذاً أنا موجودٌ.", author:"ديكارت", cat:"فلسفة" },
    { text:"الجهلُ يولّدُ الخوف، والخوفُ يولّدُ الكراهية، والكراهيةُ تولّدُ العنف.", author:"ابن رشد", cat:"فلسفة" },
    { text:"أمرُّ على الديارِ ديارِ ليلى، أُقبّلُ ذا الجدارَ وذا الجدارا.", author:"قيس بن الملوّح", cat:"حب" },
  ];

  const catColors = {
    "حكمة":"var(--c-hikma)",
    "فلسفة":"var(--c-falsafa)",
    "أدب":"var(--c-adab)",
    "حب":"var(--c-hob)",
    "حياة":"var(--c-hayat)",
  };

  // ——— تطبيع النص للبحث (إزالة التشكيل وتوحيد الحروف) ———
  function norm(s){
    return s
      .replace(/[\u064B-\u0652\u0670\u0640]/g, "")
      .replace(/[أإآ]/g, "ا")
      .replace(/ى/g, "ي")
      .replace(/ة/g, "ه")
      .trim();
  }

  const grid    = document.getElementById("grid");
  const filters = document.getElementById("filters");
  const countEl = document.getElementById("count");
  const searchI = document.getElementById("search");

  const cats = ["الكل", ...Object.keys(catColors)];
  let activeCat = "الكل";
  let term = "";

  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip" + (c === "الكل" ? " active" : "");
    b.textContent = c;
    b.addEventListener("click", () => {
      activeCat = c;
      document.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      render();
    });
    filters.appendChild(b);
  });

  function card(q){
    const color = catColors[q.cat] || "var(--lapis)";
    return `
      <article class="qcard" style="--cat:${color}">
        <div class="qmark" aria-hidden="true">&rdquo;</div>
        <p class="qtext">${q.text}</p>
        <div class="qfoot">
          <span class="author">${q.author}</span>
          <span class="cat"><span class="dot"></span>${q.cat}</span>
        </div>
      </article>`;
  }

  function render(){
    const t = norm(term);
    const list = quotes.filter(q => {
      const matchCat  = activeCat === "الكل" || q.cat === activeCat;
      const matchText = !t || norm(q.text).includes(t) || norm(q.author).includes(t);
      return matchCat && matchText;
    });

    if (list.length === 0){
      grid.innerHTML = '<p class="empty">لا توجد اقتباساتٌ مطابقة… جرّب كلمةً أخرى.</p>';
      countEl.textContent = "";
      return;
    }
    grid.innerHTML = list.map(card).join("");
    countEl.textContent = list.length + " اقتباس";
  }

  searchI.addEventListener("input", e => { term = e.target.value; render(); });
  render();
</script>
</body>
</html>
