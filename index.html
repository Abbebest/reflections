<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reflections — Wisdom from the Philosophers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:        #0e1428;
    --ink-lift:   #171f3d;
    --parchment:  #ece4d3;
    --brass:      #c8a44d;
    --muted:      #8b93b0;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ height:100%; }

  body{
    font-family:"Inter", system-ui, sans-serif;
    color:var(--parchment);
    background:
      radial-gradient(1200px 700px at 50% -10%, var(--ink-lift), transparent 60%),
      radial-gradient(900px 600px at 85% 110%, #1b2447, transparent 55%),
      var(--ink);
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(1.5rem, 5vw, 4rem);
    overflow-x:hidden;
  }

  /* faint starfield */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(236,228,211,.5), transparent),
      radial-gradient(1px 1px at 70% 20%, rgba(236,228,211,.35), transparent),
      radial-gradient(1px 1px at 40% 75%, rgba(236,228,211,.4), transparent),
      radial-gradient(1px 1px at 85% 65%, rgba(236,228,211,.3), transparent),
      radial-gradient(1px 1px at 10% 85%, rgba(236,228,211,.3), transparent),
      radial-gradient(1px 1px at 60% 50%, rgba(236,228,211,.25), transparent);
    pointer-events:none;
  }

  .frame{
    position:relative;
    width:min(720px, 100%);
    border:1px solid rgba(200,164,77,.28);
    border-radius:4px;
    padding:clamp(2rem, 6vw, 4.5rem) clamp(1.5rem, 6vw, 4rem);
    background:linear-gradient(180deg, rgba(23,31,61,.55), rgba(14,20,40,.4));
    box-shadow:0 30px 80px rgba(0,0,0,.45);
    text-align:center;
  }

  .eyebrow{
    font-size:.72rem;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--brass);
    margin-bottom:clamp(1.5rem, 5vw, 2.75rem);
    font-weight:500;
  }

  .mark{
    font-family:"Cormorant Garamond", serif;
    font-size:clamp(5rem, 18vw, 9rem);
    line-height:.4;
    color:var(--brass);
    opacity:.32;
    height:.35em;
    user-select:none;
  }

  blockquote{
    font-family:"Cormorant Garamond", serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(1.7rem, 5.5vw, 2.9rem);
    line-height:1.28;
    margin:clamp(1rem,3vw,1.75rem) auto clamp(1.75rem,4vw,2.5rem);
    max-width:26ch;
    transition:opacity .5s ease, transform .5s ease;
  }

  .attribution{
    transition:opacity .5s ease, transform .5s ease;
  }

  .name{
    display:block;
    font-size:1rem;
    font-weight:600;
    letter-spacing:.16em;
    text-transform:uppercase;
  }

  .era{
    display:block;
    margin-top:.5rem;
    font-size:.78rem;
    color:var(--muted);
    letter-spacing:.05em;
  }

  /* gold divider under attribution */
  .attribution::before{
    content:"";
    display:block;
    width:34px; height:1px;
    background:var(--brass);
    margin:0 auto 1.25rem;
    opacity:.7;
  }

  .fading blockquote,
  .fading .attribution{
    opacity:0;
    transform:translateY(6px);
  }

  footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1rem;
    margin-top:clamp(2rem, 6vw, 3.25rem);
    padding-top:1.5rem;
    border-top:1px solid rgba(236,228,211,.09);
  }

  button{
    font-family:"Inter", sans-serif;
    font-size:.82rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    font-weight:500;
    color:var(--ink);
    background:var(--brass);
    border:none;
    border-radius:2px;
    padding:.85rem 1.6rem;
    cursor:pointer;
    transition:background .25s ease, transform .1s ease;
  }
  button:hover{ background:#dcb85f; }
  button:active{ transform:translateY(1px); }
  button:focus-visible{ outline:2px solid var(--parchment); outline-offset:3px; }

  .progress{
    font-size:.78rem;
    letter-spacing:.2em;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  @media (prefers-reduced-motion: reduce){
    blockquote, .attribution{ transition:none; }
  }
</style>
</head>
<body>
  <main class="frame" id="frame">
    <p class="eyebrow">Reflections</p>
    <div class="mark" aria-hidden="true">&ldquo;</div>
    <blockquote id="quote"></blockquote>
    <div class="attribution">
      <span class="name" id="name"></span>
      <span class="era" id="era"></span>
    </div>
    <footer>
      <button id="next" aria-label="Show the next reflection">Next reflection</button>
      <span class="progress" id="progress"></span>
    </footer>
  </main>

<script>
  const quotes = [
    { q:"The unexamined life is not worth living.", name:"Socrates", era:"Greek philosopher · 470–399 BC" },
    { q:"You have power over your mind — not outside events. Realize this, and you will find strength.", name:"Marcus Aurelius", era:"Roman emperor · 121–180 AD" },
    { q:"We suffer more often in imagination than in reality.", name:"Seneca", era:"Roman Stoic · 4 BC–65 AD" },
    { q:"It is not what happens to you, but how you react to it that matters.", name:"Epictetus", era:"Greek Stoic · 50–135 AD" },
    { q:"The journey of a thousand miles begins with a single step.", name:"Lao Tzu", era:"Chinese philosopher · 6th century BC" },
    { q:"It does not matter how slowly you go, so long as you do not stop.", name:"Confucius", era:"Chinese philosopher · 551–479 BC" },
    { q:"He who has a why to live can bear almost any how.", name:"Friedrich Nietzsche", era:"German philosopher · 1844–1900" },
    { q:"No man ever steps in the same river twice.", name:"Heraclitus", era:"Greek philosopher · 535–475 BC" },
    { q:"Knowing yourself is the beginning of all wisdom.", name:"Aristotle", era:"Greek philosopher · 384–322 BC" },
    { q:"The measure of a man is what he does with power.", name:"Plato", era:"Greek philosopher · 428–348 BC" },
    { q:"Man conquers the world by conquering himself.", name:"Zeno of Citium", era:"Greek Stoic · 334–262 BC" },
    { q:"Science is organized knowledge; wisdom is organized life.", name:"Immanuel Kant", era:"German philosopher · 1724–1804" },
    { q:"No man is free who cannot command himself.", name:"Pythagoras", era:"Greek philosopher · 570–495 BC" },
    { q:"The memory of a life well spent is eternal.", name:"Cicero", era:"Roman statesman · 106–43 BC" },
  ];

  const frame    = document.getElementById("frame");
  const quoteEl  = document.getElementById("quote");
  const nameEl   = document.getElementById("name");
  const eraEl    = document.getElementById("era");
  const progress = document.getElementById("progress");
  const nextBtn  = document.getElementById("next");

  let index = Math.floor(Math.random() * quotes.length);

  function render(){
    const item = quotes[index];
    quoteEl.textContent = item.q;
    nameEl.textContent  = item.name;
    eraEl.textContent   = item.era;
    progress.textContent =
      String(index + 1).padStart(2, "0") + " / " + String(quotes.length).padStart(2, "0");
  }

  function next(){
    frame.classList.add("fading");
    setTimeout(() => {
      index = (index + 1) % quotes.length;
      render();
      frame.classList.remove("fading");
    }, 320);
  }

  render();
  nextBtn.addEventListener("click", next);
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowRight") { e.preventDefault(); next(); }
  });
</script>
</body>
</html>
